<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blunboz - Earn</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-[#0a0f1f] text-white min-h-screen font-sans">

<div id="authModal" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-[999] hidden flex items-center justify-center p-4">
  <div class="bg-[#121a33] p-6 rounded-[24px] w-full max-w-sm border border-white/10">
    <h2 class="text-xl font-bold mb-1 text-center">Welcome to Blunboz</h2>
    <p class="text-xs text-white/40 text-center mb-4">Login to start earning</p>
    <input id="email" placeholder="Email" class="w-full p-3.5 rounded-xl bg-black/50 border border-white/10 mb-3 outline-none focus:border-blue-500">
    <input id="password" type="password" placeholder="Password" class="w-full p-3.5 rounded-xl bg-black/50 border border-white/10 mb-2 outline-none focus:border-blue-500">
    <div class="text-right mb-4">
      <button onclick="forgotPass()" class="text-[11px] text-blue-400">Forgot Password?</button>
    </div>
    <button onclick="signUp()" class="w-full bg-blue-600 py-3.5 rounded-xl font-bold mb-2">SIGN UP & START EARNING</button>
    <button onclick="logIn()" class="w-full bg-white/10 py-3.5 rounded-xl font-bold">LOG IN</button>
    <p class="text-[11px] text-center mt-4 text-white/30">Referral locked: <span id="refLockText" class="text-blue-400 font-bold">BLUNBOZ</span></p>
  </div>
</div>

<div class="p-4 max-w-md mx-auto">
  <div class="flex justify-between items-center mb-6 mt-2">
    <h1 class="font-black text-[20px] tracking-wider">BLUNBOZ</h1>
    <div class="flex gap-2 items-center">
      <span id="pts" class="bg-blue-600 px-4 py-1.5 rounded-full text-sm font-bold">0 PTS</span>
      <button id="ownerBtn" onclick="openOwner()" class="hidden bg-yellow-400 text-black px-3 py-1.5 rounded-full text-[11px] font-black">OWNER</button>
    </div>
  </div>

  <div class="bg-[#121a33] rounded-[24px] p-4 border border-white/10 shadow-xl">
    <div class="flex justify-between text-sm mb-3">
      <p id="timerText" class="font-bold">Ready to watch</p>
      <p id="adCount" class="text-white/50 font-mono">0 / 30</p>
    </div>
    <div class="w-full h-2 bg-white/10 rounded-full mb-4 overflow-hidden">
      <div id="progressBar" class="h-full bg-blue-500 transition-all duration-1000" style="width:0%"></div>
    </div>
    <div id="realAdContainer" class="h-56 bg-black rounded-2xl flex flex-col items-center justify-center border border-white/5 text-center p-4">
      <p class="text-3xl mb-2">▶️</p>
      <p class="text-xs text-white/30">Click WATCH AD to start<br>Real ad will play here (15s)</p>
    </div>
    <button id="claimBtn" onclick="startAd()" class="w-full bg-blue-600 py-4 rounded-2xl font-black mt-4">WATCH AD (15s) - 50 PTS</button>
  </div>

  <!-- NEW REFERRAL DASHBOARD -->
  <div class="mt-5 bg-[#121a33] rounded-[20px] p-4 border border-white/10">
    <p class="text-sm font-bold mb-1">🔗 Your Referral Link</p>
    <p class="text-[11px] text-white/40 mb-3">Share and earn 20% lifetime</p>
    <div class="flex gap-2">
      <div id="myRefLink" class="flex-1 bg-black p-3 rounded-xl text-xs break-all border border-white/5 text-blue-300 select-all">Loading...</div>
      <button onclick="copyRef()" class="bg-blue-600 px-4 rounded-xl text-xs font-bold">COPY</button>
    </div>
    <div class="grid grid-cols-2 gap-3 mt-4">
      <div class="bg-black/40 p-3 rounded-xl border border-white/5">
        <p class="text-[10px] text-white/40">TOTAL REFERRALS</p>
        <p id="refCount" class="text-lg font-black">0</p>
      </div>
      <div class="bg-black/40 p-3 rounded-xl border border-white/5">
        <p class="text-[10px] text-white/40">REFERRAL EARNINGS</p>
        <p id="refEarn" class="text-lg font-black text-green-400">0 PTS</p>
      </div>
    </div>
    <div id="refList" class="mt-3 text-[11px] text-white/30"></div>
  </div>
</div>

<div id="ownerPanel" class="fixed inset-0 bg-[#0a0f1f] z-[998] hidden p-4 overflow-y-auto">
  <div class="max-w-md mx-auto">
    <div class="flex justify-between items-center mb-4 mt-2">
      <h2 class="font-black text-xl">Owner Dashboard</h2>
      <button onclick="document.getElementById('ownerPanel').classList.add('hidden')" class="bg-white/10 px-4 py-2 rounded-xl text-sm">Close</button>
    </div>
    <div id="allUsers" class="space-y-2 text-sm"></div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDmMIcYO12TPriCK7_LdjsI4hvqBDLjYMI",
  authDomain: "blunboz.firebaseapp.com",
  projectId: "blunboz",
  storageBucket: "blunboz.firebasestorage.app",
  messagingSenderId: "273818323763",
  appId: "1:273818323763:web:ce179709a1defb638ecc46"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const OWNER_EMAIL = "sammgodpower@gmail.com";

// GET REF FROM URL?ref=CODE
const urlParams = new URLSearchParams(window.location.search);
const refFromUrl = urlParams.get('ref') || "BLUNBOZ";
document.getElementById('refLockText').innerText = refFromUrl.toUpperCase();
localStorage.setItem('blunboz_ref', refFromUrl);

let currentUserData = null;

auth.onAuthStateChanged(async (user)=>{
  if(!user){
    document.getElementById('authModal').classList.remove('hidden');
    return;
  }
  document.getElementById('authModal').classList.add('hidden');
  if(user.email.toLowerCase() === OWNER_EMAIL.toLowerCase()){
    document.getElementById('ownerBtn').classList.remove('hidden');
  }
  const docRef = db.collection('users').doc(user.uid);
  const docSnap = await docRef.get();
  if(!docSnap.exists){
    const myCode = user.email.split('@')[0].toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8) + Math.floor(100+Math.random()*900);
    await docRef.set({
      email: user.email,
      points: 0,
      myRefCode: myCode,
      refBy: localStorage.getItem('blunboz_ref') || "BLUNBOZ",
      createdAt: new Date(),
      adsWatched: 0,
      refEarnings: 0
    });
    // reward referrer if exists
    if(localStorage.getItem('blunboz_ref') && localStorage.getItem('blunboz_ref')!== "BLUNBOZ"){
      try{
        const q = await db.collection('users').where('myRefCode','==',localStorage.getItem('blunboz_ref')).get();
        q.forEach(async d=>{ await d.ref.update({ refEarnings: firebase.firestore.FieldValue.increment(10) }) });
      }catch(e){}
    }
  }
  currentUserData = (await docRef.get()).data();
  document.getElementById('pts').innerText = currentUserData.points + " PTS";
  document.getElementById('adCount').innerText = (currentUserData.adsWatched || 0) + " / 30";

  // SHOW MY REF LINK
  const myCode = currentUserData.myRefCode || "BLUNBOZ";
  const link = "https://blunboz.vercel.app/?ref=" + myCode;
  document.getElementById('myRefLink').innerText = link;

  // LOAD MY REFERRALS
  loadMyReferrals(myCode);
});

async function loadMyReferrals(myCode){
  const snap = await db.collection('users').where('refBy','==',myCode).get();
  document.getElementById('refCount').innerText = snap.size;
  document.getElementById('refEarn').innerText = (currentUserData.refEarnings || snap.size*10) + " PTS";
  if(snap.size>0){
    let html="Your referrals:<br>";
    snap.forEach(doc=>{ html+=`• ${doc.data().email} <br>` });
    document.getElementById('refList').innerHTML=html;
  } else {
    document.getElementById('refList').innerText="No referrals yet — share your link!";
  }
}

function copyRef(){
  const txt = document.getElementById('myRefLink').innerText;
  navigator.clipboard.writeText(txt);
  alert("✅ Copied: " + txt);
}
function signUp(){
  const e=document.getElementById('email').value; const p=document.getElementById('password').value;
  if(!e||!p) return alert("Fill email & password");
  auth.createUserWithEmailAndPassword(e,p).catch(err=>alert(err.message));
}
function logIn(){
  const e=document.getElementById('email').value; const p=document.getElementById('password').value;
  if(!e||!p) return alert("Fill email & password");
  auth.signInWithEmailAndPassword(e,p).catch(err=>alert(err.message));
}
function forgotPass(){
  const e=document.getElementById('email').value;
  if(!e) return alert("Enter your email first");
  auth.sendPasswordResetEmail(e).then(()=>alert("✅ Reset link sent to "+e)).catch(err=>alert(err.message));
}
let watching=false;
function startAd(){
  if(watching) return;
  if(currentUserData && currentUserData.adsWatched >= 30) return alert("Daily limit");
  watching=true; let timeLeft=15;
  const btn=document.getElementById('claimBtn');
  const timerText=document.getElementById('timerText');
  const progress=document.getElementById('progressBar');
  const adContainer=document.getElementById('realAdContainer');
  btn.disabled=true;
  let interval=setInterval(()=>{
    timeLeft--; timerText.innerText=`Watching... ${timeLeft}s`; btn.innerText=`WAIT ${timeLeft}s...`;
    progress.style.width=((15-timeLeft)/15*100)+"%";
    adContainer.innerHTML=`<p class='text-3xl animate-pulse'>▶️</p><p class='text-sm font-bold mt-2'>Ad Playing... ${timeLeft}s</p>`;
    if(timeLeft<=0){
      clearInterval(interval); watching=false;
      timerText.innerText="✅ Claim Now"; progress.style.width="100%";
      btn.disabled=false; btn.innerText="CLAIM 50 PTS ✅";
      btn.className="w-full bg-green-500 py-4 rounded-2xl font-black mt-4 animate-pulse";
      btn.onclick=claimPoints;
    }
  },1000);
}
async function claimPoints(){
  const user=auth.currentUser; const docRef=db.collection('users').doc(user.uid);
  await docRef.update({ points: firebase.firestore.FieldValue.increment(50), adsWatched: firebase.firestore.FieldValue.increment(1) });
  currentUserData.points+=50; currentUserData.adsWatched++;
  document.getElementById('pts').innerText=currentUserData.points+" PTS";
  document.getElementById('adCount').innerText=currentUserData.adsWatched+" / 30";
  const btn=document.getElementById('claimBtn');
  btn.innerText="WATCH AD (15s) - 50 PTS"; btn.className="w-full bg-blue-600 py-4 rounded-2xl font-black mt-4";
  btn.onclick=startAd;
}
function openOwner(){
  if(!auth.currentUser || auth.currentUser.email.toLowerCase()!==OWNER_EMAIL.toLowerCase()) return;
  document.getElementById('ownerPanel').classList.remove('hidden'); loadAllUsers();
}
async function loadAllUsers(){
  const snap=await db.collection('users').orderBy('createdAt','desc').limit(50).get();
  let html=""; snap.forEach(doc=>{ const d=doc.data(); html+=`<div class='bg-[#121a33] p-3 rounded-xl border border-white/5 flex justify-between'><span>${d.email}<br><span class='text-[10px] text-white/30'>Code:${d.myRefCode||''} RefBy:${d.refBy||''}</span></span><span class='text-blue-400 font-bold'>${d.points} PTS</span></div>`; });
  document.getElementById('allUsers').innerHTML=html||"No users";
}
</script>
</body>
  </html>
