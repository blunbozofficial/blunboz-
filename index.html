<style>
body{font-family:Arial;background:#0f0f0f;color:#fff;text-align:center;padding:20px}
button{background:#00ff88;color:#000;border:none;padding:16px 32px;border-radius:12px;font-size:18px;font-weight:bold;margin:10px;cursor:pointer;width:90%}

<body>
<h1>💰 Blunboz</h1>
<div id="balance">$0.0000</div>
<div>30 ads / day</div>

<div class="card">
<button onclick="watchAd()">▶️ Watch Ad & Earn $0.0100</button>
<p id="status">Click to watch ad</p>
<p>Ads today: <span id="count">0</span>/30</p>
</div>

<script>
let balance = parseFloat(localStorage.getItem('blunboz_bal')||'0');
let count = parseInt(localStorage.getItem('blunboz_count')||'0');
let lastDay = localStorage.getItem('blunboz_day')||new Date().toDateString();
if(lastDay !== new Date().toDateString()){ count=0; lastDay=new Date().toDateString(); localStorage.setItem('blunboz_day',lastDay); }

document.getElementById('balance').innerText='$'+balance.toFixed(4);
document.getElementById('count').innerText=count;

function watchAd(){
 if(count>=30){ alert('Daily limit reached! Come back tomorrow'); return; }
 document.getElementById('status').innerText='Loading ad...';

 // Monetag Rewarded Interstitial
 if(typeof show_11933586 === 'function'){
   show_11933586().then(()=>{
     // User watched full ad
     balance+=0.01;
     count++;
     localStorage.setItem('blunboz_bal',balance);
     localStorage.setItem('blunboz_count',count);
     localStorage.setItem('blunboz_day',lastDay);
     document.getElementById('balance').innerText='$'+balance.toFixed(4);
     document.getElementById('count').innerText=count;
     document.getElementById('status').innerText='✅ +$0.01 Earned! Watch again';
     if(window.Telegram) Telegram.WebApp.HapticFeedback.notificationOccurred('success');
   }).catch(e=>{
     document.getElementById('status').innerText='Ad closed early, try again';
   });
 } else {
   document.getElementById('status').innerText='Ad not ready, retry in 2 sec';
   setTimeout(()=>{ if(typeof show_11933586==='function') watchAd(); },2000);
 }
}
</script>
</body>
