<!DOCTYPE html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blunboz</title>
<script src='//libtl.com/sdk.js' data-zone='11933586' data-sdk='show_11933586'></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial;padding-bottom:70px}
.header{text-align:center;padding:20px}
#bal{font-size:36px;color:#00ff88;font-weight:bold}
.nav{position:fixed;bottom:0;left:0;right:0;background:#1a1a1a;display:flex;justify-content:around;padding:10px 0}
.nav button{background:none;border:none;color:#888;padding:10px;font-size:14px}
.nav button.active{color:#00ff88}
.page{display:none;padding:20px}.page.active{display:block}
.card{background:#1e1e1e;padding:20px;border-radius:16px;margin:15px 0;text-align:center}
.btn{background:#00ff88;color:#000;border:none;padding:14px 28px;border-radius:12px;font-weight:bold;width:100%;font-size:16px}
</style>
</head><body>
<div class="header">
<div>💰 <b>Blunboz</b></div>
<div id="bal">$0.0110</div>
<div style="opacity:.7">30 ads / day</div>
</div>

<div id="home" class="page active">
<div class="card">
<button class="btn" onclick="watchAd()">▶️ Watch Ad & Earn $0.0100</button>
<p id="status">✅ +$0.01 Earned! Watch again</p>
<p>Ads today: <span id="count">1</span>/30</p>
</div>
</div>

<div id="tasks" class="page">
<div class="card"><h3>📋 Tasks</h3><p>Join @BlunbozChannel — Earn $0.05</p><button class="btn">Do Task</button></div>
</div>

<div id="refer" class="page">
<div class="card"><h3>👥 Refer & Earn</h3><p>Get 10% of friends earnings</p><p id="reflink" style="word-break:break-all;font-size:12px">https://t.me/BlunbozearnusdtBot/blunboz</p><button class="btn" onclick="navigator.clipboard.writeText(document.getElementById('reflink').innerText)">Copy Link</button></div>
</div>

<div id="wallet" class="page">
<div class="card"><h3>💳 Wallet</h3><p>Balance: <span class="baltxt"></span></p><p>Min withdraw $1.00 USDT</p><button class="btn">Withdraw</button></div>
</div>

<div class="nav">
<button onclick="openTab('home')" id="b-home" class="active">🏠 Home</button>
<button onclick="openTab('tasks')" id="b-tasks">📋 Tasks</button>
<button onclick="openTab('refer')" id="b-refer">👥 Refer</button>
<button onclick="openTab('wallet')" id="b-wallet">💳 Wallet</button>
</div>

<script>
let balance=parseFloat(localStorage.getItem('blunboz_bal')||'0.011');
let count=parseInt(localStorage.getItem('blunboz_count')||'1');
function updateUI(){ document.getElementById('bal').innerText='$'+balance.toFixed(4); document.getElementById('count').innerText=count; document.querySelectorAll('.baltxt').forEach(e=>e.innerText='$'+balance.toFixed(4)); }
updateUI();
function openTab(t){ document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.getElementById(t).classList.add('active'); document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active')); document.getElementById('b-'+t).classList.add('active'); }
function watchAd(){
 if(count>=30){alert('Limit reached');return;}
 document.getElementById('status').innerText='Loading ad...';
 if(typeof show_11933586==='function'){
  show_11933586().then(()=>{ balance+=0.01; count++; localStorage.setItem('blunboz_bal',balance); localStorage.setItem('blunboz_count',count); updateUI(); document.getElementById('status').innerText='✅ +$0.01 Earned! Watch again'; });
 } else { document.getElementById('status').innerText='Ad not ready, retry'; }
}
</script>
</body></html>
