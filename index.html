<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Blunboz</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
:root{--bg:#0a1931;--card:#13284d;--accent:#7b5cf6;--blue:#3b82f6;--green:#00e676}
body{margin:0;background:var(--bg);color:#fff;font-family:Inter,sans-serif;padding-bottom:80px}
.header{padding:16px;display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#a78bfa,#3b82f6);display:grid;place-items:center;font-weight:900}
.balance{background:var(--card);margin:12px;border-radius:20px;padding:18px;text-align:center;border:1px solid #ffffff10}
.balance h1{font-size:32px;margin:6px 0}
.btn{width:100%;padding:14px;border-radius:14px;border:0;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--accent),var(--blue));margin-top:10px}
.task{background:var(--card);margin:10px 12px;padding:14px;border-radius:14px;display:flex;justify-content:space-between;align-items:center}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0f2447;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #ffffff15}
.nav div{text-align:center;font-size:11px;opacity:.6} .nav .active{opacity:1;color:var(--accent)}
</style>
</head>
<body>
<div class="header"><div class="logo">B</div><div><b id="uname">Loading...</b><br><small style="opacity:.6">Blunboz Earn</small></div></div>

<div class="balance">
<small>BALANCE</small>
<h1><span id="bal">0.00</span> <small style="font-size:14px">USDT</small></h1>
<button class="btn" onclick="watchAd()">🎬 Watch Ad +0.001 USDT</button>
<button class="btn" style="background:#1a3a6b" onclick="showWithdraw()">Withdraw</button>
</div>

<div id="tasks">
<div class="task"><span>📺 Daily Ads (0/20)</span><b id="adCount">0</b></div>
<div class="task"><span>👥 Referrals</span><b id="refCount">0</b></div>
</div>

<div class="nav">
<div class="active" onclick="location.reload()">🏠<br>Home</div>
<div onclick="watchAd()">🎬<br>Tasks</div>
<div onclick="showWithdraw()">💼<br>Wallet</div>
<div onclick="share()">👥<br>Refer</div>
</div>

<script>
const tg = window.Telegram.WebApp; tg.expand(); tg.ready();
const user = tg.initDataUnsafe?.user || {id:12345, first_name:"Test User", username:"test"};
document.getElementById('uname').innerText = user.first_name + (user.username ? ' @'+user.username : '');

// SIMPLE LOCAL STORAGE FOR NOW - you can connect to backend later
let bal = parseFloat(localStorage.getItem('blunboz_bal')||'0');
let ads = parseInt(localStorage.getItem('blunboz_ads')||'0');
document.getElementById('bal').innerText = bal.toFixed(3);
document.getElementById('adCount').innerText = ads;

// Adsgram
const AdController = window.Adsgram?.init({ blockId: "17742" });

async function watchAd(){
 if(ads>=20){ alert("Daily limit reached (20/day)"); return; }
 try{
   if(AdController){ await AdController.show(); }
   bal+=0.001; ads++;
   localStorage.setItem('blunboz_bal', bal);
   localStorage.setItem('blunboz_ads', ads);
   document.getElementById('bal').innerText = bal.toFixed(3);
   document.getElementById('adCount').innerText = ads;
   tg.HapticFeedback.notificationOccurred('success');
 }catch(e){ alert("Ad not ready, try again"); }
}

function share(){
 const link = `https://t.me/BlunbozearnusdtBot/blunboz?startapp=${user.id}`;
 const text = `Join Blunboz and earn USDT! ${link}`;
 if(navigator.share){ navigator.share({text}); } else { prompt("Copy your referral link:", link); }
}

function showWithdraw(){
 if(bal<1){ alert("Minimum 1 USDT to withdraw. Keep watching ads!"); return; }
 let addr = prompt("Enter your USDT (TRC20) address:");
 if(addr){ alert("Withdrawal request for "+bal.toFixed(3)+" USDT to "+addr+" submitted! (Demo mode)"); }
}

// Handle referral code from startapp
const startParam = new URLSearchParams(location.search).get('startapp') || tg.initDataUnsafe?.start_param;
if(startParam){ console.log("Referred by:", startParam); }
</script>
</body>
  </html>
